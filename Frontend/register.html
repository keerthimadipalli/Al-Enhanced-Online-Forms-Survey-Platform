<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – FormFlow</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">FormFlow</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create account</h2>
      <p>Start building forms today — it's free.</p>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" />
      </div>

      <p class="error-msg" id="errorMsg"></p>
      <p class="success-msg" id="successMsg">Account created! Redirecting to login...</p>

      <button class="btn-primary btn-block mt-10" onclick="handleRegister()">Create Account</button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const err = document.getElementById('errorMsg');
      const ok = document.getElementById('successMsg');
      err.style.display = 'none'; ok.style.display = 'none';

      if (!name || !email || !password) { err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return; }
      if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }

      fetch('http://localhost:5000/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          ok.style.display = 'block';
          setTimeout(() => window.location.href = 'login.html', 1200);
        } else {
          err.textContent = data.message || 'Registration failed.';
          err.style.display = 'block';
        }
      })
      .catch(() => {
        // Local fallback
        const users = JSON.parse(localStorage.getItem('ff_users') || '[]');
        if (users.find(u => u.email === email)) {
          err.textContent = 'Email already registered.'; err.style.display = 'block'; return;
        }
        users.push({ name, email, password });
        localStorage.setItem('ff_users', JSON.stringify(users));
        ok.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 1200);
      });
    }
  </script>
</body>
</html>
